server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI-backed endpoints (e.g. Gmail auto-import) can take a while; the
        # default 60s proxy timeout produces a 504 before the backend answers.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # The app shell and the runtime config carry no content hash, so a cached copy
    # would keep pointing at the previous build's bundles after a rebuild.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # Everything the build emits is content-hashed, so it can never go stale.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
