<div class="dialog-backdrop">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="event-dialog-title">
    <h2 id="event-dialog-title">Event erstellen</h2>

    <label>
      Name
      <input [(ngModel)]="newItemText" name="name" />
    </label>

    <label>
      Kosten
      <input [(ngModel)]="newItemCost" name="kosten" type="number" />
    </label>

    <label>
      Trip-ID
      <input [(ngModel)]="newItemTrip" name="tripId" type="number" />
    </label>

    <div class="dialog-actions">
      <button class="secondary-button" type="button" (click)="closeDialog()">Abbrechen</button>
      <button class="primary-button" type="button" (click)="sendEvent()" [disabled]="isSending">
        {{ isSending ? 'Sendet...' : 'Speichern' }}
      </button>
    </div>
  </div>
</div>

@if (message) {
  <p>{{ message }}</p>
}
