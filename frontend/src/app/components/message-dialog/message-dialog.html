<div class="dialog-card">
  <div class="dialog-body">
    <span class="icon-badge" [class]="type" aria-hidden="true">
      <span class="material-icons">{{ icon }}</span>
    </span>

    <div class="dialog-text">
      <h2>{{ title }}</h2>
      <p>{{ message }}</p>
    </div>
  </div>

  <div class="dialog-actions">
    <button type="button" class="ok-button" (click)="close()">OK</button>
  </div>
</div>
