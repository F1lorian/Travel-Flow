<h2>Cashbook</h2>

<div class="form">
  <input
    [ngModel]="amount()"
    (ngModelChange)="amount.set($event)"
    type="number"
    placeholder="Betrag"
  />

  <input
    [ngModel]="date()"
    (ngModelChange)="date.set($event)"
    type="date"
  />

  <select
    [ngModel]="category()"
    (ngModelChange)="category.set($event)"
  >
    <option value="">Kategorie wählen</option>
    @for (cat of categories; track cat) {
      <option [value]="cat">{{ cat }}</option>
    }
  </select>

  <button (click)="addExpense()">Hinzufügen</button>
</div>

<table>
  <thead>
  <tr>
    <th>Betrag (€)</th>
    <th>Datum</th>
    <th>Kategorie</th>
    <th>Aktionen</th>
  </tr>
  </thead>

  <tbody>
    @for (expense of expenses(); track expense.id) {
      <tr>
        <td>{{ expense.kosten }}</td>
        <td>{{ expense.date }}</td>
        <td>{{ expense.kategorie }}</td>
        <td>
          <button (click)="deleteExpense(expense.id)">❌</button>
        </td>
      </tr>
    }
  </tbody>
</table>
