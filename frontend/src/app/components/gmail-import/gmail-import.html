<div class="flex min-h-[60vh] items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-8 text-center shadow-sm">
    <h1 class="text-xl font-semibold text-slate-800">Gmail import</h1>

    @if (state() === 'connecting') {
      <p class="mt-3 text-sm text-slate-600" role="status">{{ message() }}</p>
    }

    @if (state() === 'success') {
      <p class="mt-3 rounded bg-green-50 px-3 py-2 text-sm text-green-700" role="status">
        {{ message() }}
      </p>
    }

    @if (state() === 'error') {
      <p class="mt-3 rounded bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">
        {{ message() }}
      </p>

      <button
        (click)="backToCalendar()"
        class="mt-4 rounded bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700">
        Back to calendar
      </button>
    }
  </div>
</div>
