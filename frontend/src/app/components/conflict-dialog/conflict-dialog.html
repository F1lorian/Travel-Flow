<div class="w-[560px] max-w-[calc(100vw-32px)] bg-white p-8 shadow-xl ring-1 ring-slate-200 rounded-xl">
  <div class="mb-5">
    <div>
      <h2 class="text-2xl font-bold tracking-tight text-slate-900">
        Zeitkonflikt gefunden
      </h2>
      <p class="mt-1 text-sm leading-6 text-slate-600">
        In diesem Zeitraum gibt es bereits ein oder mehrere Events.
      </p>
    </div>
  </div>

  <div class="mb-6 max-h-64 space-y-3 overflow-y-auto rounded-lg border border-slate-200 bg-slate-50 p-3">
    @for (conflict of conflicts; track conflict.id) {
      <div class="rounded-md border border-slate-200 bg-white p-4">
        <p class="font-semibold text-slate-900">
          {{ conflict.name }}
        </p>
        <p class="mt-1 text-sm text-slate-600">
          {{ formatDateTime(conflict.start) }} - {{ formatDateTime(conflict.end) }}
        </p>
      </div>
    }
  </div>

  <div class="flex justify-end gap-2">
    <button
      (click)="cancel()"
      class="rounded-lg border border-slate-300 bg-white px-5 py-3
         font-semibold text-slate-700
         transition hover:bg-slate-100">
      Zurück
    </button>

    <button
      (click)="confirm()"
      class="rounded-lg bg-slate-900 px-5 py-3 font-semibold text-white
         transition hover:bg-slate-700 active:scale-[0.99]">
      Trotzdem erstellen
    </button>
  </div>
</div>
