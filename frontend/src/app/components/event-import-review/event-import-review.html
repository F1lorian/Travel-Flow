<div class="w-[560px] max-w-[calc(100vw-32px)] bg-white p-8 shadow-xl ring-1 ring-slate-200 rounded-xl">
  <div class="mb-5">
    <h2 class="text-2xl font-bold tracking-tight text-slate-900">
      Review events
    </h2>
    <p class="mt-1 text-sm leading-6 text-slate-600">
      Choose which events to import into your calendar.
    </p>
  </div>

  <div class="mb-6 max-h-72 space-y-3 overflow-y-auto rounded-lg border border-slate-200 bg-slate-50 p-3">
    @for (row of rows; track row) {
      <label class="flex cursor-pointer items-start gap-3 rounded-md border border-slate-200 bg-white p-4">
        <input
          type="checkbox"
          [checked]="row.selected"
          (change)="toggle(row)"
          class="mt-1 h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
        <span class="min-w-0">
          <span class="block truncate font-semibold text-slate-900">
            {{ row.event.name || row.subject || '(No title)' }}
          </span>
          <span class="mt-1 block text-sm text-slate-600">
            {{ formatDateTime(row.event.start) }} - {{ formatDateTime(row.event.end) }}
          </span>
        </span>
      </label>
    }
  </div>

  <div class="flex items-center justify-between gap-2">
    <span class="text-sm text-slate-500">{{ selectedCount }} of {{ rows.length }} selected</span>

    <div class="flex gap-2">
      <button
        (click)="cancel()"
        class="rounded-lg border border-slate-300 bg-white px-5 py-3
           font-semibold text-slate-700
           transition hover:bg-slate-100">
        Cancel
      </button>

      <button
        (click)="confirm()"
        [disabled]="selectedCount === 0"
        class="rounded-lg bg-slate-900 px-5 py-3 font-semibold text-white
           transition hover:bg-slate-700 active:scale-[0.99]
           disabled:cursor-not-allowed disabled:bg-slate-400">
        Import checked
      </button>
    </div>
  </div>
</div>
