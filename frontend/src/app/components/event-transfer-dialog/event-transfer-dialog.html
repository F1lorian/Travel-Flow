<div class="w-[560px] bg-white p-8 shadow-xl ring-1 ring-slate-200 rounded-xl">
  @if(mode === 'import'){
    <h2 class="mb-1 text-3xl font-bold tracking-tight text-slate-900">Event Import</h2>
    <div class="flex flex-col gap-2">

      <label class="font-semibold text-sm">
        Event-Datei importieren
      </label>

      <div
        class="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-10
         text-center transition
         hover:border-blue-500 hover:bg-blue-50/40"

        (click)="fileInput.click()"
        (dragover)="onDragOver($event)"
        (drop)="onFileDrop($event)">

        @if (!fileName){
          <p class="text-base font-semibold text-slate-800">
            Datei hier ablegen
          </p>

          <p class="mt-1 text-sm text-slate-500">
            oder klicken zum Hochladen
          </p>

        }

        @if(fileName){
          <p
          class="text-base font-semibold text-slate-800">
          {{ fileName }}
          </p>
        }

      </div>

      <label class="mb-2 block text-sm font-semibold text-slate-700" for="tripId">Trip auswählen</label>
      <input
        [(ngModel)]="tripId"
        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3
         text-slate-900 placeholder:text-slate-400
         outline-none transition
         focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10">

      <input
        #fileInput
        hidden
        type="file"
        accept=".eml"
        (change)="onFileSelected($event)">


    </div>
  }


  @if(mode === 'export'){
    <h1 class="text-2xl font-bold mb-4">Event Export</h1>
    <button
      (click)="downloadEvents()"
      class="rounded-lg bg-slate-900 px-5 py-3 font-semibold text-white
         transition hover:bg-slate-700 active:scale-[0.99]">

      Download
    </button>
  }
  <div class="flex justify-end gap-2">

    @if(file){
      <button
        (click)="uploadFile()"
        class="rounded-lg bg-slate-900 px-5 py-3 font-semibold text-white
         transition hover:bg-slate-700 active:scale-[0.99]">

        Importieren
      </button>
    }

    <button
      (click)="close()"
      class="rounded-lg border border-slate-300 bg-white px-5 py-3
         font-semibold text-slate-700
         transition hover:bg-slate-100">
      Schließen
    </button>
  </div>


</div>
