<div class="p-6 w-[400px]">

  @if(mode === 'import'){
    <h1 class="text-2xl font-bold mb-4">Event Import</h1>
    <div class="flex flex-col gap-2">

      <label class="font-semibold text-sm">
        Event-Datei importieren
      </label>

      <div
        class="border-2 border-dashed rounded-xl p-8 text-center cursor-pointer
           hover:border-blue-500 hover:bg-blue-50 transition"

        (click)="fileInput.click()"
        (dragover)="onDragOver($event)"
        (drop)="onFileDrop($event)">

        @if (!fileName){
          <p
          class="text-gray-500">
          Datei hier hineinziehen oder klicken
          </p>

        }

        @if(fileName){
          <p
          class="font-medium">
          {{ fileName }}
          </p>
        }

      </div>

      <input
        #fileInput
        hidden
        type="file"
        accept=".json,.ics,.csv"
        (change)="onFileSelected($event)">


    </div>
  }


  @if(mode === 'export'){
    <h1 class="text-2xl font-bold mb-4">Event Export</h1>
    <button
      (click)="downloadEvents()"
      class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg transition">

      Download
    </button>
  }
  <div class="flex justify-end gap-2">

    @if(file){
      <button
        (click)="uploadFile()"
        class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg transition">
        Importieren
      </button>
    }

    <button
      (click)="close()"
      class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg transition"
    >
      Schließen
    </button>
  </div>


</div>
