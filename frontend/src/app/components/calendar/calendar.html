

<div class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-lg p-6">

    <h1 class="text-3xl font-bold mb-6">
      Calendar
    </h1>

    <full-calendar #calendar [options]="calendarOptions"></full-calendar>

    <!-- Colors mirror the .fc-event classes in styles.css (calendar-event,
         friend-calendar-event, trip-event, invited-trip-event). -->
    <div class="mt-4 flex flex-wrap items-center gap-x-6 gap-y-2 text-sm text-slate-600">
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-[#2563eb]"></span>
        My events
      </span>
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-[#16a34a]"></span>
        Friends' events
      </span>
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-[#334155]"></span>
        My trips
      </span>
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-[#9333ea]"></span>
        Friends' trips
      </span>
    </div>

  </div>
</div>
