

<div class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-lg p-6">

    <h1 class="text-3xl font-bold mb-6">
      Calendar
    </h1>

    <full-calendar #calendar [options]="calendarOptions"></full-calendar>

    <!-- Same --cal-* tokens as the .fc-event classes in styles.css, so the
         legend can never drift from the actual event colors again. -->
    <div class="mt-4 flex flex-wrap items-center gap-x-6 gap-y-2 text-sm text-slate-600">
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-[var(--cal-event-mine)]"></span>
        My events
      </span>
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-[var(--cal-event-friend)]"></span>
        Friends' events
      </span>
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-[var(--cal-trip-mine)]"></span>
        My trips
      </span>
      <span class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-[var(--cal-trip-invited)]"></span>
        Friends' trips
      </span>
    </div>

  </div>
</div>
