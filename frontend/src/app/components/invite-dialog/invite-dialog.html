<div class="invite-dialog">
  <mat-dialog-content class="max-h-[80vh] overflow-y-auto px-6 pt-6">
    <h2 class="mb-6 text-3xl font-bold tracking-tight text-slate-900">Invite friend to trip</h2>

    <div class="relative">
      <button
        type="button"
        (click)="inviteDropdownOpen = !inviteDropdownOpen"
        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-left text-slate-900 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 flex justify-between items-center">
        <span class="font-semibold">Choose Friends to invite</span>
        <mat-icon class="text-gray-400">expand_more</mat-icon>
      </button>

      @if (inviteDropdownOpen) {
        <div class="w-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg">
          @for (friend of friends; track friend.id) {
            <div class="flex items-center justify-between gap-3 px-4 py-2 hover:bg-slate-50">
              <div class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-xs font-semibold text-blue-700 shrink-0">
                  {{ friend.firstName | slice:0:1 }}{{ friend.surname | slice:0:1 }}
                </div>
                <span class="text-sm text-slate-800">{{ friend.firstName }} {{ friend.surname }} {{ '@' + friend.username }}</span>
              </div>
              <button
                type="button"
                (click)="selection.includes(friend) ? removeSelection(friend) : selectFriend(friend)"
                [class]="selection.includes(friend)
    ? 'rounded-md bg-green-100 px-3 py-1 text-xs font-semibold text-green-700'
    : 'rounded-md bg-slate-900 px-3 py-1 text-xs font-semibold text-white transition hover:bg-slate-700'">
                {{ selection.includes(friend) ? 'Invited' : 'Invite' }}
              </button>
            </div>
          }
        </div>
      }
    </div>

    <label class="mt-4 flex cursor-pointer items-start gap-3 rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
      <input
        type="checkbox"
        [(ngModel)]="includeEvents"
        class="mt-0.5 h-4 w-4 shrink-0 accent-blue-600" />
      <span class="text-sm text-slate-800">
        <span class="font-semibold">Add to all trip events</span>
        <span class="block text-xs text-slate-500">
          Invited friends join every event of this trip as soon as they accept the trip invitation —
          no separate event invites needed.
        </span>
      </span>
    </label>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="border-t border-slate-200 px-6 py-4 !m-0">
    <div class="flex w-full gap-3">
      <button
        type="button"
        [disabled]="selection.length === 0"
        (click)="inviteSelectedFriend()"
        class="flex-1 rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white
       transition hover:bg-blue-700 active:scale-[0.99]
       disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-500">
        Send Invitations
      </button>
    </div>
  </mat-dialog-actions>
</div>
