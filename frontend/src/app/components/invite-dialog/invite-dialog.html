<div class="invite-dialog">
  <h2>Invite friend to trip</h2>

  <div class="relative">
    <button
      type="button"
      (click)="inviteDropdownOpen = !inviteDropdownOpen"
      class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-left text-slate-900 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 flex justify-between items-center">
      <span>Choose Friends to invite</span>
      <mat-icon class="text-gray-400">expand_more</mat-icon>
    </button>

    @if (inviteDropdownOpen) {
      <div class="absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-48 overflow-y-auto">
        @for (friend of friends; track friend.id) {
          <div class="flex items-center justify-between gap-3 px-4 py-2 hover:bg-gray-50">
            <div class="flex items-center gap-3">
              <div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-xs font-semibold text-blue-700 shrink-0">
                {{ friend.firstName | slice:0:1 }}{{ friend.surname | slice:0:1 }}
              </div>
              <span class="text-sm text-slate-800">{{ friend.firstName }} {{ friend.surname }} {{ '@' + friend.username }}</span>
            </div>
            <button
              type="button"
              (click)="selection.includes(friend) ? removeSelection(friend) : selectFriend(friend)"
              [class]="selection.includes(friend)
    ? 'rounded-md bg-green-100 px-3 py-1 text-xs font-semibold text-green-700'
    : 'rounded-md bg-slate-900 px-3 py-1 text-xs font-semibold text-white hover:bg-slate-700'">
              {{ selection.includes(friend) ? 'Invited' : 'Invite' }}
            </button>
          </div>
        }
      </div>
    }
  </div>

  <button
    type="button"
    [disabled]="selection.length === 0"
    (click)="inviteSelectedFriend()"
  >
    Send Invitations
  </button>
</div>
