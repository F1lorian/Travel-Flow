<h2>Spending Overview</h2>

<div class="date-filter">
  <div class="date-field">
    <label for="start">From:</label>
    <input
      id="start"
      type="date"
      [(ngModel)]="startDate"
      (change)="loadExpenses()"
    />
  </div>

  <div class="date-field">
    <label for="end">Bis:</label>
    <input
      id="end"
      type="date"
      [(ngModel)]="endDate"
      (change)="loadExpenses()"
    />
  </div>
</div>

<a class="add-expense-button" routerLink="/cashbook">Ausgabe hinzufügen</a>

<hr />

<h3>Übersicht</h3>

<pre>{{ categorySummary | json }}</pre>

<hr />

<h3>Letzte ausgaben</h3>

<div *ngIf="expenses.length === 0">
  Keine Ausgaben gefunden.
</div>

<table *ngIf="expenses.length > 0" border="1">
  <thead>
  <tr>
    <th>Kosten</th>
    <th>Trip</th>
    <th>Datum</th>
    <th>Kategorie</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let expense of displayedExpenses">
    <td>{{ expense.kosten }}</td>
    <td>{{ expense.trip }}</td>
    <td>{{ expense.date }}</td>
    <td>{{ expense.kategorie }}</td>
  </tr>
  </tbody>
</table>

<button
  *ngIf="expenses.length > 5 && !showAllExpenses"
  type = "button"
  (click)="showAllExpenses = true"
>Alle Ausgaben anzeigen</button>
