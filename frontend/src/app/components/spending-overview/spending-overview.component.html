<h2>Spending Overview</h2>

<div class="date-filter">
  <div class="date-field">
    <label for="start">From:</label>
    <input
      id="start"
      type="date"
      [(ngModel)]="startDate"
      (change)="loadExpenses()"
    />
  </div>

  <div class="date-field">
    <label for="end">Bis:</label>
    <input
      id="end"
      type="date"
      [(ngModel)]="endDate"
      (change)="loadExpenses()"
    />
  </div>
</div>

<a class="add-expense-button" routerLink="/cashbook">Ausgabe hinzufügen</a>

<hr />

<h3>Übersicht</h3>

<label for="trip-auswaehlen">Filtern:</label>

<select
  id="trip-auswaehlen"
  (change)="openTripOverview($event)"
>
  <option value="">Nach Trip filtern</option>
  <option *ngFor="let trip of trips" [value]="trip.id">
    {{ trip.name }}
  </option>
</select>


<apx-chart
  [series] = "chartseries"
  [labels] = "chartlabels"
  [chart] = "chartDetails">
</apx-chart>

<table class="category-table">
  <thead>
  <tr>
    <th>Kategorie</th>
    <th>Ausgaben</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let item of categorySummary | keyvalue">
    <td>{{ item.key }}</td>
    <td>{{ item.value }}</td>
  </tr>
  </tbody>
</table>

<hr />

<h3>Letzte ausgaben</h3>

<div *ngIf="expenses.length === 0">
  Keine Ausgaben gefunden.
</div>

<table *ngIf="expenses.length > 0" class="expenses-table">
  <thead>
  <tr>
    <th>Kosten</th>
    <th>Trip</th>
    <th>Datum</th>
    <th>Kategorie</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let expense of displayedExpenses">
    <td>{{ expense.kosten }}</td>
    <td>{{ expense.trip }}</td>
    <td>{{ expense.date }}</td>
    <td>{{ expense.kategorie }}</td>
  </tr>
  </tbody>
</table>

<button
  *ngIf="expenses.length > 5 && !showAllExpenses"
  type = "button"
  (click)="showAllExpenses = true"
>Alle Ausgaben anzeigen</button>

<button
  *ngIf="expenses.length > 5 && showAllExpenses"
  type = "button"
  (click)="showAllExpenses = false"
>Weniger anzeigen</button>
