services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      -  8082:8080
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sep
      SPRING_DATASOURCE_USERNAME: sep
      SPRING_DATASOURCE_PASSWORD: sepsep123
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_AUTH: ${SPRING_MAIL_AUTH:-true}
      SPRING_MAIL_STARTTLS: ${SPRING_MAIL_STARTTLS:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-1025057911520-0ede0s968df42p8h5fkr8fajod9gju5k.apps.googleusercontent.com}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - 4200:80
    environment:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-1025057911520-0ede0s968df42p8h5fkr8fajod9gju5k.apps.googleusercontent.com}
    depends_on:
      - backend

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: sep
      POSTGRES_USER: sep
      POSTGRES_PASSWORD: sepsep123
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - 5433:5432

volumes:
  db_data:
