stages:
  - lint
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  # Enable BuildKit for faster, cache-friendly builds
  DOCKER_BUILDKIT: "1"
  # Optional but recommended for performance
  DOCKER_DRIVER: overlay2

backend_lint:
  stage: lint
  image: eclipse-temurin:21-jdk
  tags:
    - dind
    - ude-sse
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key: gradle
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
  script:
    - cd backend
    - sh ./gradlew spotlessCheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.build_template: &build_template
  stage: build
  image: docker:26
  services:
    - name: docker:26-dind
      alias: docker
  # Make sure to use a runner with the dind tag (that can actually build) and ude-sse
  tags:
    - dind
    - ude-sse
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build_frontend:
  <<: *build_template
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/frontend"
    - SHA_TAG="$CI_COMMIT_SHORT_SHA"
    - BRANCH_TAG="$CI_COMMIT_REF_SLUG"
 
    - docker build -t "$IMAGE:$SHA_TAG" frontend/
    - docker push "$IMAGE:$SHA_TAG"
 
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$BRANCH_TAG"
        docker push "$IMAGE:$BRANCH_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      fi
 
build_backend:
  <<: *build_template
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/backend"
    - SHA_TAG="$CI_COMMIT_SHORT_SHA"
    - BRANCH_TAG="$CI_COMMIT_REF_SLUG"
 
    - docker build -t "$IMAGE:$SHA_TAG" backend/
    - docker push "$IMAGE:$SHA_TAG"
 
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$BRANCH_TAG"
        docker push "$IMAGE:$BRANCH_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      fi
