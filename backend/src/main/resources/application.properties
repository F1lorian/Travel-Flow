spring.application.name=sep-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sep}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sep}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sepsep123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
server.port=${SERVER_PORT:8082}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}
gemini.detection.max-retries=${GEMINI_DETECTION_MAX_RETRIES:3}
gemini.detection.backoff-millis=${GEMINI_DETECTION_BACKOFF_MILLIS:500}
# Gemini's quota resets per minute, so a rate limit needs seconds of backoff, not milliseconds.
gemini.detection.rate-limit-backoff-millis=${GEMINI_DETECTION_RATE_LIMIT_BACKOFF_MILLIS:5000}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}

jwt.secret=${JWT_SECRET:sep-development-secret-change-me}

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:1025057911520-6m14kai5lfd4jaeek0o3g4mq54nuo9ci.apps.googleusercontent.com}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:4200/gmail-import}

gmail.import.max-messages=${GMAIL_IMPORT_MAX_MESSAGES:10}
gmail.token.encryption-secret=${GMAIL_TOKEN_ENCRYPTION_SECRET:sep-development-gmail-token-secret-change-me}
