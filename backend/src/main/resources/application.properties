spring.application.name=sep-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sep}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sep}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sepsep123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
server.port=${SERVER_PORT:8082}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# Per-request timeout (ms) for a single Gemini extraction call.
gemini.request-timeout-ms=${GEMINI_REQUEST_TIMEOUT_MS:15000}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}

jwt.secret=${JWT_SECRET:sep-development-secret-change-me}

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:1025057911520-0ede0s968df42p8h5fkr8fajod9gju5k.apps.googleusercontent.com}

# Gmail Import (OAuth 2.0 authorization-code flow + Gmail API).
# The client secret and redirect URI are required for the offline authorization-code
# flow that yields a refresh token; the ID-token login flow above does not need them.
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:4200/gmail-import}
# Number of most recent inbox messages scanned per import run.
gmail.import.max-messages=${GMAIL_IMPORT_MAX_MESSAGES:10}
# How many messages are fetched+parsed in parallel during a scan.
gmail.import.scan-concurrency=${GMAIL_IMPORT_SCAN_CONCURRENCY:5}
# Hard deadline (seconds) for a scan; keep it below the reverse-proxy read timeout.
gmail.import.scan-timeout-seconds=${GMAIL_IMPORT_SCAN_TIMEOUT_SECONDS:45}
# Secret used to encrypt stored Gmail tokens at rest (change in production).
gmail.token.encryption-secret=${GMAIL_TOKEN_ENCRYPTION_SECRET:sep-development-token-secret-change-me}
