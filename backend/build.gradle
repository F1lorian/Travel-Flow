plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.4.0'
}

group = 'com.sep'
version = '0.0.1-SNAPSHOT'
description = 'SEP backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'com.google.genai:google-genai:1.53.0'
	implementation 'com.google.api-client:google-api-client:2.7.2'
	// Loads the repo-root .env into the Spring Environment so `./gradlew bootRun` picks up
	// GOOGLE_OAUTH_*, GEMINI_*, etc. locally (Docker already feeds these via compose.yaml).
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-mail'
	runtimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	// The repo-root .env lives one directory above this module, but bootRun runs from `backend/`.
	// Point spring-dotenv at the parent so `./gradlew bootRun` loads GOOGLE_OAUTH_*, GEMINI_*, etc.
	// (Docker already supplies these via compose.yaml; a missing .env is ignored by default).
	systemProperty 'springdotenv.directory', rootProject.projectDir.parentFile.absolutePath
}

spotless {
	java {
		target 'src/**/*.java'
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.named('check') {
	dependsOn 'spotlessCheck'
}
